[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holospex-ml"
version = "0.1.0"
description = "Offline perception adapters and contract validation for the Holospex training prototype"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
holospex-ml = "holospex_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
